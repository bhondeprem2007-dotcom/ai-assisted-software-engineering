name: AI Program Test

on:
  push:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run student marks program
  run: 
    output=$(printf "80\n80\n80\n80\n80\n" | python student_marks.py)
    echo "$output"
    echo "$output" | grep -q "Percentage: 80.0"
    echo "Functional test passed"
